{% extends 'base.html' %}
{% block title %}Password reset complete - Ghar Ko Swad{% endblock %}
{% block extra_css %}
<style>
body { min-height: 100vh; background: var(--cream-warm, #F5F3F0); }
.card { border-radius: 16px; border: 1px solid var(--border, #E7E5E4); background: var(--surface, #fff); }
section .btn-primary { background: var(--gold, #EA580C); border-color: var(--gold); }
</style>
{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 text-center">
                        <div class="mb-3"><i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i></div>
                        <h1 class="h4 fw-bold mb-3">Password reset complete</h1>
                        <p class="text-muted mb-4">Your password has been set. You can now log in with your new password.</p>
                        <a href="{% url 'core:login' %}" class="btn btn-primary">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
